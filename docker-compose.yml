services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: packmate
      POSTGRES_USER: packmate
      POSTGRES_PASSWORD: packmate
    ports:
      - "65001:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packmate -d packmate"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "65002:8123"
      - "65003:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    privileged: true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./data/segments:/data/segments
      - ./data/raw:/data/raw
      - ./pcaps:/pcaps:ro
      - /sys/fs/bpf:/sys/fs/bpf
    environment:
      BAZALT_LISTEN: 0.0.0.0:65000
      BAZALT_CAPTURE_MODE: ${BAZALT_CAPTURE_MODE:-}
      PACKMATE_CAPTURE_MODE: ${PACKMATE_CAPTURE_MODE:-}
      BAZALT_INTERFACE: ${BAZALT_INTERFACE:-}
      PACKMATE_INTERFACE: ${PACKMATE_INTERFACE:-}
      BAZALT_QUEUE_IDS: ${BAZALT_QUEUE_IDS:-}
      PACKMATE_QUEUE_IDS: ${PACKMATE_QUEUE_IDS:-}
      BAZALT_CPU_AUTO: ${BAZALT_CPU_AUTO:-true}
      PACKMATE_CPU_AUTO: ${PACKMATE_CPU_AUTO:-}
      BAZALT_CPU_BUDGET: ${BAZALT_CPU_BUDGET:-}
      PACKMATE_CPU_BUDGET: ${PACKMATE_CPU_BUDGET:-}
      BAZALT_TOKIO_WORKERS: ${BAZALT_TOKIO_WORKERS:-}
      PACKMATE_TOKIO_WORKERS: ${PACKMATE_TOKIO_WORKERS:-}
      BAZALT_CAPTURE_CPUS: ${BAZALT_CAPTURE_CPUS:-}
      PACKMATE_CAPTURE_CPUS: ${PACKMATE_CAPTURE_CPUS:-}
      BAZALT_FLOW_CPUS: ${BAZALT_FLOW_CPUS:-}
      PACKMATE_FLOW_CPUS: ${PACKMATE_FLOW_CPUS:-}
      BAZALT_L7_CPUS: ${BAZALT_L7_CPUS:-}
      PACKMATE_L7_CPUS: ${PACKMATE_L7_CPUS:-}
      BAZALT_MATCHER_CPUS: ${BAZALT_MATCHER_CPUS:-}
      PACKMATE_MATCHER_CPUS: ${PACKMATE_MATCHER_CPUS:-}
      BAZALT_PCAP_FILE: ${BAZALT_PCAP_FILE:-}
      PACKMATE_PCAP_FILE: ${PACKMATE_PCAP_FILE:-}
      BAZALT_BPF_FILTER: ${BAZALT_BPF_FILTER:-}
      PACKMATE_BPF_FILTER: ${PACKMATE_BPF_FILTER:-}
      BAZALT_CAPTURE_BATCH: ${BAZALT_CAPTURE_BATCH:-}
      PACKMATE_CAPTURE_BATCH: ${PACKMATE_CAPTURE_BATCH:-}
      BAZALT_CAPTURE_ENQUEUE_TIMEOUT_US: ${BAZALT_CAPTURE_ENQUEUE_TIMEOUT_US:-}
      PACKMATE_CAPTURE_ENQUEUE_TIMEOUT_US: ${PACKMATE_CAPTURE_ENQUEUE_TIMEOUT_US:-}
      BAZALT_CAPTURE_FALLBACK_PCAP: ${BAZALT_CAPTURE_FALLBACK_PCAP:-}
      PACKMATE_CAPTURE_FALLBACK_PCAP: ${PACKMATE_CAPTURE_FALLBACK_PCAP:-}
      BAZALT_EARLY_PORT_FILTER: ${BAZALT_EARLY_PORT_FILTER:-false}
      PACKMATE_EARLY_PORT_FILTER: ${PACKMATE_EARLY_PORT_FILTER:-}
      BAZALT_CAPTURE_QUEUE: ${BAZALT_CAPTURE_QUEUE:-}
      PACKMATE_CAPTURE_QUEUE: ${PACKMATE_CAPTURE_QUEUE:-}
      BAZALT_FLOW_QUEUE: ${BAZALT_FLOW_QUEUE:-}
      PACKMATE_FLOW_QUEUE: ${PACKMATE_FLOW_QUEUE:-}
      BAZALT_MATCH_QUEUE: ${BAZALT_MATCH_QUEUE:-}
      PACKMATE_MATCH_QUEUE: ${PACKMATE_MATCH_QUEUE:-}
      BAZALT_STORAGE_QUEUE: ${BAZALT_STORAGE_QUEUE:-}
      PACKMATE_STORAGE_QUEUE: ${PACKMATE_STORAGE_QUEUE:-}
      BAZALT_FLOW_SHARDS: ${BAZALT_FLOW_SHARDS:-}
      PACKMATE_FLOW_SHARDS: ${PACKMATE_FLOW_SHARDS:-}
      BAZALT_L7_WORKERS: ${BAZALT_L7_WORKERS:-}
      PACKMATE_L7_WORKERS: ${PACKMATE_L7_WORKERS:-}
      BAZALT_MATCHER_WORKERS: ${BAZALT_MATCHER_WORKERS:-}
      PACKMATE_MATCHER_WORKERS: ${PACKMATE_MATCHER_WORKERS:-}
      BAZALT_TCP_IDLE_SECS: ${BAZALT_TCP_IDLE_SECS:-}
      PACKMATE_TCP_IDLE_SECS: ${PACKMATE_TCP_IDLE_SECS:-}
      BAZALT_TCP_GAP_TIMEOUT_MS: ${BAZALT_TCP_GAP_TIMEOUT_MS:-}
      PACKMATE_TCP_GAP_TIMEOUT_MS: ${PACKMATE_TCP_GAP_TIMEOUT_MS:-}
      BAZALT_UDP_IDLE_SECS: ${BAZALT_UDP_IDLE_SECS:-}
      PACKMATE_UDP_IDLE_SECS: ${PACKMATE_UDP_IDLE_SECS:-}
      BAZALT_LIVE_FLOW_UPDATE_MS: ${BAZALT_LIVE_FLOW_UPDATE_MS:-}
      PACKMATE_LIVE_FLOW_UPDATE_MS: ${PACKMATE_LIVE_FLOW_UPDATE_MS:-}
      BAZALT_MAX_FLOW_BYTES: ${BAZALT_MAX_FLOW_BYTES:-}
      PACKMATE_MAX_FLOW_BYTES: ${PACKMATE_MAX_FLOW_BYTES:-}
      BAZALT_MAX_OOO_BYTES: ${BAZALT_MAX_OOO_BYTES:-}
      PACKMATE_MAX_OOO_BYTES: ${PACKMATE_MAX_OOO_BYTES:-}
      BAZALT_MAX_OOO_SEGMENTS: ${BAZALT_MAX_OOO_SEGMENTS:-}
      PACKMATE_MAX_OOO_SEGMENTS: ${PACKMATE_MAX_OOO_SEGMENTS:-}
      BAZALT_IP_FRAGMENT_CACHE_BYTES: ${BAZALT_IP_FRAGMENT_CACHE_BYTES:-}
      PACKMATE_IP_FRAGMENT_CACHE_BYTES: ${PACKMATE_IP_FRAGMENT_CACHE_BYTES:-}
      BAZALT_IP_FRAGMENT_MAX_DATAGRAMS: ${BAZALT_IP_FRAGMENT_MAX_DATAGRAMS:-}
      PACKMATE_IP_FRAGMENT_MAX_DATAGRAMS: ${PACKMATE_IP_FRAGMENT_MAX_DATAGRAMS:-}
      BAZALT_IP_FRAGMENT_TIMEOUT_SECS: ${BAZALT_IP_FRAGMENT_TIMEOUT_SECS:-}
      PACKMATE_IP_FRAGMENT_TIMEOUT_SECS: ${PACKMATE_IP_FRAGMENT_TIMEOUT_SECS:-}
      BAZALT_TUNNEL_DECAPSULATION: ${BAZALT_TUNNEL_DECAPSULATION:-true}
      PACKMATE_TUNNEL_DECAPSULATION: ${PACKMATE_TUNNEL_DECAPSULATION:-}
      BAZALT_MATCH_OVERLAP_BYTES: ${BAZALT_MATCH_OVERLAP_BYTES:-}
      PACKMATE_MATCH_OVERLAP_BYTES: ${PACKMATE_MATCH_OVERLAP_BYTES:-}
      BAZALT_SEGMENT_DIR: /data/segments
      BAZALT_SEGMENT_MAX_BYTES: ${BAZALT_SEGMENT_MAX_BYTES:-}
      PACKMATE_SEGMENT_MAX_BYTES: ${PACKMATE_SEGMENT_MAX_BYTES:-}
      BAZALT_RAW_CAPTURE: ${BAZALT_RAW_CAPTURE:-}
      PACKMATE_RAW_CAPTURE: ${PACKMATE_RAW_CAPTURE:-}
      BAZALT_RAW_SEGMENT_DIR: /data/raw
      BAZALT_PACKET_LOGGING: ${BAZALT_PACKET_LOGGING:-}
      PACKMATE_PACKET_LOGGING: ${PACKMATE_PACKET_LOGGING:-}
      BAZALT_POSTGRES_URL: postgres://packmate:packmate@127.0.0.1:65001/packmate
      BAZALT_CLICKHOUSE_URL: http://127.0.0.1:65002
      BAZALT_CLICKHOUSE_DATABASE: packmate
      BAZALT_REPLAY_WORKERS: ${BAZALT_REPLAY_WORKERS:-}
      PACKMATE_REPLAY_WORKERS: ${PACKMATE_REPLAY_WORKERS:-}
      BAZALT_REPLAY_PAUSE_PCT: ${BAZALT_REPLAY_PAUSE_PCT:-}
      PACKMATE_REPLAY_PAUSE_PCT: ${PACKMATE_REPLAY_PAUSE_PCT:-}
      BAZALT_AUTH_ENABLED: ${BAZALT_AUTH_ENABLED:-true}
      BAZALT_AUTH_USERNAME: ${BAZALT_AUTH_USERNAME:-}
      BAZALT_AUTH_PASSWORD: ${BAZALT_AUTH_PASSWORD:-}
      BAZALT_AUTH_SESSION_SECS: ${BAZALT_AUTH_SESSION_SECS:-43200}
      BAZALT_AUTH_COOKIE_SECURE: ${BAZALT_AUTH_COOKIE_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
